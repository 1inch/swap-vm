name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Restore Hardhat cache
        uses: actions/cache/restore@v4
        id: hh-cache
        with:
          path: |
            cache
            artifacts
          key: hh-${{ runner.os }}-${{ hashFiles('yarn.lock', 'hardhat.config.ts') }}-${{ github.sha }}
          restore-keys: |
            hh-${{ runner.os }}-${{ hashFiles('yarn.lock', 'hardhat.config.ts') }}-

      - name: Install node modules
        run: yarn install --frozen-lockfile

      - name: Run tests
        id: test
        run: yarn test

      - name: Run snapshot check
        run: yarn snapshot:check

      # After tests so cache/test-artifacts/ is warm for the next SHA.
      - name: Save Hardhat cache
        if: always() && steps.test.outcome == 'success' && steps.hh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            artifacts
          key: hh-${{ runner.os }}-${{ hashFiles('yarn.lock', 'hardhat.config.ts') }}-${{ github.sha }}
